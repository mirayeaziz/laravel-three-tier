apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
  labels: {app: laravel-app}
spec:
  replicas: 2
  selector:
    matchLabels: {app: laravel-app}
  template:
    metadata:
      labels: {app: laravel-app}
    spec:
      containers:
        - name: php-fpm
          image: laravel-app:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          env:
            - {name: APP_NAME, value: "Laravel"}
            - {name: APP_ENV, value: "production"}
            - {name: APP_DEBUG, value: "false"}
            - {name: APP_URL, value: "http://localhost:30080"}
            - {name: DB_CONNECTION, value: "mysql"}
            - {name: DB_HOST, value: "mysql"}
            - {name: DB_PORT, value: "3306"}
            - {name: SESSION_DRIVER, value: "file"}
            - {name: CACHE_STORE, value: "file"}
            - {name: QUEUE_CONNECTION, value: "sync"}
            - name: APP_KEY
              valueFrom: {secretKeyRef: {name: laravel-secrets, key: APP_KEY}}
            - name: DB_DATABASE
              valueFrom: {secretKeyRef: {name: laravel-secrets, key: DB_DATABASE}}
            - name: DB_USERNAME
              valueFrom: {secretKeyRef: {name: laravel-secrets, key: DB_USERNAME}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: laravel-secrets, key: DB_PASSWORD}}
          readinessProbe:
            tcpSocket: {port: 9000}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-app
spec:
  selector: {app: laravel-app}
  ports:
    - port: 9000
      targetPort: 9000
